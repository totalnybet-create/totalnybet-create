name: Legnica Slot PR Check

on:
  pull_request:
    branches: [royal-arc-casino]
    paths:
      - 'casino/legnica/**'
      - '.github/scripts/legnica-v3-smoke.mjs'
      - '.github/workflows/legnica-slot-ci.yml'
      - '.github/workflows/legnica-slot-pr.yml'

permissions:
  contents: read

jobs:
  browser-qa-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate V3 source
        run: |
          test -f casino/legnica/index.html
          test -f casino/legnica/v3.css
          test -f casino/legnica/v3.js
          grep -q 'BRAMA PIASTÓW' casino/legnica/index.html
          grep -q 'id="reels"' casino/legnica/index.html
          grep -q 'id="spin"' casino/legnica/index.html
          grep -q 'width=3840' casino/legnica/v3.css
          grep -q 'Portal_castle_legnica.JPG' casino/legnica/v3.css
          grep -q 'function spin()' casino/legnica/v3.js
          node --check casino/legnica/v3.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory casino/legnica >/tmp/legnica-v3-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/legnica-v3-http.log
          exit 1
      - name: Browser smoke and screenshots
        env:
          SLOT_URL: http://127.0.0.1:4173/
        run: node .github/scripts/legnica-v3-smoke.mjs
      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legnica-v3-pr-qa
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 14
