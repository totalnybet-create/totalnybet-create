name: Termux Bridge

on:
  push:
    branches:
      - casino-turnkey-base
    paths:
      - '.termux-command/task.txt'
  workflow_dispatch:
    inputs:
      task:
        description: 'Allowed task: status, sync, build, test'
        required: true
        default: 'status'

concurrency:
  group: termux-bridge
  cancel-in-progress: false

jobs:
  termux:
    runs-on: [self-hosted, linux, arm64, termux]
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout casino branch
        uses: actions/checkout@v4
        with:
          ref: casino-turnkey-base
          fetch-depth: 1
          submodules: recursive

      - name: Resolve requested task
        id: task
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK='${{ inputs.task }}'
          else
            TASK="$(tr -d '\r\n ' < .termux-command/task.txt)"
          fi
          case "$TASK" in
            status|sync|build|test) ;;
            *) echo "Unsupported task: $TASK" >&2; exit 64 ;;
          esac
          echo "task=$TASK" >> "$GITHUB_OUTPUT"

      - name: Status
        if: steps.task.outputs.task == 'status'
        shell: bash
        run: |
          set -euo pipefail
          echo "TERMUX_RUNNER_ONLINE"
          uname -a
          node --version || true
          npm --version || true
          git --version
          pwd

      - name: Sync
        if: steps.task.outputs.task == 'sync'
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git log -1 --oneline
          git submodule status --recursive

      - name: Setup Node 22
        if: steps.task.outputs.task == 'build' || steps.task.outputs.task == 'test'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: casino/portal/package-lock.json

      - name: Build portal
        if: steps.task.outputs.task == 'build'
        shell: bash
        working-directory: casino/portal
        env:
          NEXT_PUBLIC_SITE_URL: https://totalnybet-create.pages.dev
          NEXT_PUBLIC_SITE_NAME: TotalnyBet
          NEXT_PUBLIC_SITE_TAGLINE: Social Casino
          NEXT_PUBLIC_SITE_DESCRIPTION: TotalnyBet casino portal build
          NEXT_PUBLIC_SUPPORT_EMAIL: support@example.invalid
          NEXT_PUBLIC_API_URL: http://127.0.0.1
          NEXT_PUBLIC_TENANT_SLUG: crashx
          NEXT_PUBLIC_CRASH_REAL_MONEY: 'false'
          NEXT_PUBLIC_REALTIME_ENABLED: 'false'
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Test portal
        if: steps.task.outputs.task == 'test'
        shell: bash
        working-directory: casino/portal
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
