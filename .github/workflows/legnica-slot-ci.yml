name: Legnica Castle Slot CI

on:
  push:
    branches:
      - legnica-castle-slot-pro
    paths:
      - 'casino/legnica/**'
      - '.github/workflows/legnica-slot-ci.yml'
  pull_request:
    branches:
      - royal-arc-casino
    paths:
      - 'casino/legnica/**'
      - '.github/workflows/legnica-slot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legnica-slot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required PRO V2 source
        run: |
          test -f casino/legnica/index.html
          grep -q '<!doctype html>' casino/legnica/index.html
          grep -q 'BRAMA PIASTÓW' casino/legnica/index.html
          grep -q 'id="reels"' casino/legnica/index.html
          grep -q 'id="spin"' casino/legnica/index.html
          grep -q 'featureRail' casino/legnica/index.html
          grep -q 'Klucze do Bramy' casino/legnica/index.html
          grep -q 'function spin()' casino/legnica/index.html

      - name: Validate HTML parse
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          p = Path('casino/legnica/index.html')
          data = p.read_text(encoding='utf-8')
          class Parser(HTMLParser): pass
          Parser().feed(data)
          assert '<html' in data.lower() and '</html>' in data.lower()
          assert '<script' in data.lower() and '</script>' in data.lower()
          assert data.count('class="tower') >= 2
          assert 'grid-template-columns:repeat(5,1fr)' in data
          assert 'prefers-reduced-motion' in data
          print('Legnica PRO V2 HTML parse OK')
          PY

      - name: Validate embedded JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('casino/legnica/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          assert scripts, 'No embedded script found'
          Path('/tmp/legnica-slot.js').write_text('\n'.join(scripts), encoding='utf-8')
          print('Embedded JS extracted')
          PY
          node --check /tmp/legnica-slot.js

      - name: Static delivery smoke
        run: |
          python -m http.server 4173 --directory casino/legnica >/tmp/legnica-slot-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/tmp/legnica-slot.html; then break; fi
            sleep 1
          done
          grep -q 'BRAMA PIASTÓW' /tmp/legnica-slot.html
          grep -q 'id="spin"' /tmp/legnica-slot.html
          grep -q 'id="reels"' /tmp/legnica-slot.html
          grep -q 'KRÓLEWSKI JACKPOT' /tmp/legnica-slot.html

      - name: Package validated slot
        run: |
          mkdir -p dist
          cp -R casino/legnica/. dist/
          printf '%s\n' "commit=${GITHUB_SHA}" > dist/build-info.txt
          printf '%s\n' "branch=${GITHUB_REF_NAME}" >> dist/build-info.txt
          printf '%s\n' "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/build-info.txt

      - name: Upload validated build artifact
        uses: actions/upload-artifact@v4
        with:
          name: legnica-castle-slot-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
