name: Legnica Castle Slot CI

on:
  push:
    branches: [legnica-castle-slot-pro]
    paths:
      - 'casino/legnica/**'
      - '.github/scripts/legnica-v4-smoke.mjs'
      - '.github/workflows/legnica-slot-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legnica-slot-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate V4 machine
        run: |
          test -f casino/legnica/index.html
          test -f casino/legnica/v4.css
          test -f casino/legnica/v4.js
          grep -q 'V4 Cabinet' casino/legnica/index.html
          grep -q 'class="cabinet"' casino/legnica/index.html
          grep -q 'id="reels"' casino/legnica/index.html
          grep -q 'id="spin"' casino/legnica/index.html
          grep -q 'grid-template-columns:repeat(5,1fr)' casino/legnica/v4.css
          grep -q 'function spin()' casino/legnica/v4.js
          node --check casino/legnica/v4.js
      - name: Parse HTML
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          s=Path('casino/legnica/index.html').read_text(encoding='utf-8')
          class P(HTMLParser): pass
          P().feed(s)
          assert 'v4.css' in s and 'v4.js' in s
          assert 'class="pillar left"' in s and 'class="pillar right"' in s
          assert s.count('class="line ') >= 5
          print('Legnica V4 HTML OK')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start slot server
        run: |
          python3 -m http.server 4173 --directory casino/legnica >/tmp/legnica-v4-http.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/legnica-v4-http.log
          exit 1
      - name: Browser QA + screenshots
        env:
          SLOT_URL: http://127.0.0.1:4173/
        run: node .github/scripts/legnica-v4-smoke.mjs
      - name: Package validated slot
        run: |
          mkdir -p dist
          cp -R casino/legnica/. dist/
          printf '%s\n' "commit=${GITHUB_SHA}" > dist/build-info.txt
          printf '%s\n' "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> dist/build-info.txt
      - name: Upload V4 QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legnica-v4-qa-${{ github.sha }}
          path: |
            qa-artifacts-v4
            dist
          if-no-files-found: warn
          retention-days: 14
