name: Build Premium Design Studio APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-premium-studio/**'
      - '.github/workflows/build-premium-design-studio-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        working-directory: android-premium-studio
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          cp android-premium-studio/app/build/outputs/apk/debug/app-debug.apk PremiumDesignStudio-1.0.0-debug.apk
          sha256sum PremiumDesignStudio-1.0.0-debug.apk > PremiumDesignStudio-1.0.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PremiumDesignStudio-APK
          path: |
            PremiumDesignStudio-1.0.0-debug.apk
            PremiumDesignStudio-1.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
