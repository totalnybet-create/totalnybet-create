name: Build Premium Design Studio APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-premium-studio/**'
      - '.github/workflows/build-premium-design-studio-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        id: sdk
        continue-on-error: true
        run: |
          set -o pipefail
          { yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'; } 2>&1 | tee sdk-install.log

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: android-premium-studio
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../android-build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PremiumDesignStudio-BuildLogs
          path: |
            sdk-install.log
            android-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK exists
        run: test -f android-premium-studio/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare artifact
        run: |
          cp android-premium-studio/app/build/outputs/apk/debug/app-debug.apk PremiumDesignStudio-1.0.0-debug.apk
          sha256sum PremiumDesignStudio-1.0.0-debug.apk > PremiumDesignStudio-1.0.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PremiumDesignStudio-APK
          path: |
            PremiumDesignStudio-1.0.0-debug.apk
            PremiumDesignStudio-1.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
