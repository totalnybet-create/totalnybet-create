name: Import turnkey casino base

on:
  push:
    branches:
      - casino-turnkey-base
    paths:
      - .github/workflows/import-casino-base.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: casino-turnkey-base
          fetch-depth: 0

      - name: Import MIT casino API and portal
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/casino-api /tmp/casino-portal casino
          git clone --depth 1 https://github.com/scriptcasino/free-casino-script-api.git /tmp/casino-api
          git clone --depth 1 https://github.com/scriptcasino/free-casino-script-portal.git /tmp/casino-portal
          rm -rf /tmp/casino-api/.git /tmp/casino-portal/.git
          mkdir -p casino/api casino/portal
          cp -a /tmp/casino-api/. casino/api/
          cp -a /tmp/casino-portal/. casino/portal/
          cat > casino/README-IMPORT.md <<'EOF'
# Turnkey Casino Base

Imported unchanged from two MIT-licensed upstream repositories:

- API/Admin: https://github.com/scriptcasino/free-casino-script-api
- Player Portal: https://github.com/scriptcasino/free-casino-script-portal

Structure:
- `api/` — Laravel API, auth, wallet, VIP, Filament admin, migrations, Docker/Sail
- `portal/` — Next.js player portal, wallet/profile UI, i18n, responsive frontend

Upstream code is preserved as imported. Payment/real-money operation must remain disabled or sandboxed until legal/compliance review and operator licensing are handled separately.
EOF

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "casino-import-bot"
          git config user.email "casino-import-bot@users.noreply.github.com"
          git add casino
          if git diff --cached --quiet; then
            echo "No import changes"
            exit 0
          fi
          git commit -m "Import CrashX turnkey casino base"
          git push origin HEAD:casino-turnkey-base
