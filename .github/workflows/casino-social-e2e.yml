name: Casino Social E2E

on:
  workflow_dispatch:
  push:
    branches:
      - casino-turnkey-social-ready
    paths:
      - '.github/workflows/casino-social-e2e.yml'

jobs:
  live-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify auth wallet daily bonus Royal Arc and play-money guards
        shell: bash
        env:
          API: https://wmcgybrgnxeghvryqitt.supabase.co/functions/v1/casino-api
        run: |
          set -euo pipefail
          USERNAME="qa_$(date +%s)_${RANDOM}"
          PASSWORD="Persone-QA-${RANDOM}-A9!"

          health="$(curl -fsS "$API/api/v1/health")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True; assert d["mode"] == "play-money"; assert d["version"] >= 4' <<<"$health"

          config="$(curl -fsS "$API/api/v1/site/config")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["tenant"]["slug"] == "persone-royale"; assert d["tenant"]["name"] == "PERSONE ROYALE CASINO"; assert d["currency"] == "CHIP"; assert d["features"]["real_money"] is False; assert d["features"]["deposits"] is False; assert d["features"]["withdrawals"] is False; assert d["features"]["daily_bonus"] is True' <<<"$config"

          register="$(curl -fsS -X POST "$API/api/v1/auth/register" \
            -H 'content-type: application/json' \
            --data "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\",\"password_confirmation\":\"$PASSWORD\"}")"

          TOKEN="$(python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("token"); assert d["user"]["tenant_id"] == "persone-royale"; print(d["token"])' <<<"$register")"
          START="$(python -c 'import json,sys; d=json.load(sys.stdin); assert d["user"]["wallet"]["currency"] == "CHIP"; assert d["user"]["wallet"]["balance_minor"] == 250000; print(d["user"]["wallet"]["balance_minor"])' <<<"$register")"
          test "$START" = "250000"

          login="$(curl -fsS -X POST "$API/api/v1/auth/login" \
            -H 'content-type: application/json' \
            --data "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\"}")"
          LOGIN_TOKEN="$(python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("token"); print(d["token"])' <<<"$login")"

          status="$(curl -fsS "$API/api/v1/wallet/daily-bonus" -H "authorization: Bearer $LOGIN_TOKEN")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["available"] is True; assert d["amount_minor"] == 50000' <<<"$status"

          first_bonus="$(curl -fsS -X POST "$API/api/v1/wallet/daily-bonus" -H "authorization: Bearer $LOGIN_TOKEN")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["claimed"] is True; assert d["amount_minor"] == 50000; assert d["balance_minor"] == 300000' <<<"$first_bonus"

          second_bonus="$(curl -fsS -X POST "$API/api/v1/wallet/daily-bonus" -H "authorization: Bearer $LOGIN_TOKEN")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["claimed"] is False; assert d["amount_minor"] == 0; assert d["balance_minor"] == 300000' <<<"$second_bonus"

          tx="$(curl -fsS "$API/api/v1/wallet/transactions?per_page=20" -H "authorization: Bearer $LOGIN_TOKEN")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert sum(1 for x in d["data"] if x["type"] == "daily_bonus" and x["amount_minor"] == 50000) == 1' <<<"$tx"

          spin="$(curl -fsS -X POST "$API/api/v1/games/royal-arc/spin" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $LOGIN_TOKEN" \
            --data '{"bet_minor":100,"free_spin":false}')"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["game"] == "royal_arc"; assert d["play_money"] is True; assert len(d["matrix"]) == 5; assert isinstance(d["balance_minor"], int); assert d["balance_minor"] >= 0' <<<"$spin"

          withdraw_code="$(curl -sS -o /tmp/withdraw.json -w '%{http_code}' -X POST "$API/api/v1/wallet/withdraw" \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $LOGIN_TOKEN" \
            --data '{"amount":1}')"
          test "$withdraw_code" = "410"
          python -c 'import json; d=json.load(open("/tmp/withdraw.json")); assert d["code"] == "PLAY_MONEY_ONLY"'

          logout="$(curl -fsS -X POST "$API/api/v1/auth/logout" -H "authorization: Bearer $LOGIN_TOKEN")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True' <<<"$logout"

          echo "E2E_OK username=$USERNAME start_balance_minor=$START daily_bonus_minor=50000"

      - name: Verify live Poker WebSocket handshake
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/persone-ws && cd /tmp/persone-ws
          npm init -y >/dev/null 2>&1
          npm install ws@8 --no-save >/dev/null 2>&1
          node <<'NODE'
          const WebSocket = require('ws');
          let opened = false;
          const ws = new WebSocket('wss://www.personeroyale.pl/api/games/poker/ws', {
            origin: 'https://www.personeroyale.pl',
            handshakeTimeout: 15000,
          });
          const timer = setTimeout(() => {
            console.error('POKER_WS_TIMEOUT');
            process.exit(1);
          }, 20000);
          ws.on('open', () => {
            opened = true;
            console.log('POKER_WS_OPEN');
            ws.close(1000, 'qa');
          });
          ws.on('unexpected-response', (_req, res) => {
            console.error(`POKER_WS_HTTP_${res.statusCode}`);
            clearTimeout(timer);
            process.exit(1);
          });
          ws.on('error', (err) => {
            console.error('POKER_WS_ERROR', err.message);
            clearTimeout(timer);
            process.exit(1);
          });
          ws.on('close', (code) => {
            clearTimeout(timer);
            if (!opened) process.exit(1);
            console.log(`POKER_WS_CLOSED_${code}`);
            process.exit(0);
          });
          NODE
