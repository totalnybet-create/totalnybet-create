name: Royal Arc Slot Smoke

on:
  push:
    branches:
      - royal-arc-slot-v1
    paths:
      - 'casino/**'
      - 'index.html'
      - '.github/scripts/slot-smoke.mjs'
      - '.github/workflows/slot-smoke.yml'
  pull_request:
    branches:
      - royal-arc-qa-base
    paths:
      - 'casino/**'
      - 'index.html'
      - '.github/scripts/slot-smoke.mjs'
      - '.github/workflows/slot-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/royal-arc-http.log 2>&1 &
          echo $! > /tmp/royal-arc-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/royal-arc-http.log
          exit 1

      - name: Run browser smoke
        env:
          SLOT_URL: http://127.0.0.1:4173/
        run: node .github/scripts/slot-smoke.mjs

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: royal-arc-slot-qa
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 14
