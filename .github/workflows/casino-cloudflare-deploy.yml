name: Casino Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-prod
    paths:
      - 'casino/api-service/**'
      - '.github/workflows/casino-cloudflare-deploy.yml'

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casino/api-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing GitHub secret CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing GitHub secret CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Deploy casino-api worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Upload runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.CASINO_DATABASE_URL }}
          APP_KEY: ${{ secrets.CASINO_APP_KEY }}
          ADMIN_PASSWORD: ${{ secrets.CASINO_ADMIN_PASSWORD }}
        run: |
          test -n "$DATABASE_URL" || (echo 'Missing GitHub secret CASINO_DATABASE_URL' && exit 1)
          test -n "$APP_KEY" || (echo 'Missing GitHub secret CASINO_APP_KEY' && exit 1)
          test -n "$ADMIN_PASSWORD" || (echo 'Missing GitHub secret CASINO_ADMIN_PASSWORD' && exit 1)
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
          printf '%s' "$APP_KEY" | npx wrangler secret put APP_KEY
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD

      - name: Verify edge health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deployments list || true
