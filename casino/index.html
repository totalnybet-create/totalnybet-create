<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#09070c" />
  <title>Royal Arc — Premium Slot Prototype</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./hotfix.css" />
</head>
<body>
  <main class="slot-app" aria-label="Royal Arc premium slot">
    <header class="top-hud">
      <div class="brand-lockup">
        <span class="brand-kicker">ROYAL ARC</span>
        <strong>THE CROWN VAULT</strong>
      </div>
      <div class="top-metrics" aria-live="polite">
        <div><span>BALANCE</span><b id="balance">1 000.00</b></div>
        <div><span>WIN</span><b id="win">0.00</b></div>
      </div>
    </header>

    <section class="machine-shell">
      <div class="frame-crown" aria-hidden="true">♛</div>
      <div class="frame-title">THE CROWN VAULT</div>
      <div class="frame-lights frame-lights-left" aria-hidden="true"></div>
      <div class="frame-lights frame-lights-right" aria-hidden="true"></div>
      <div id="canvas-host" class="canvas-host" aria-label="Pole gry 5 na 3"></div>
      <div class="win-banner" id="win-banner" aria-live="assertive">
        <span id="win-label">WYGRANA</span>
        <strong id="win-amount">0.00</strong>
      </div>
    </section>

    <section class="status-strip" aria-live="polite">
      <span id="status">GOTOWY</span>
      <span id="free-spins" class="free-spins"></span>
    </section>

    <footer class="control-deck">
      <div class="bet-control">
        <span>STAWKA</span>
        <div class="bet-row">
          <button id="bet-down" type="button" aria-label="Zmniejsz stawkę">−</button>
          <b id="bet">1.00</b>
          <button id="bet-up" type="button" aria-label="Zwiększ stawkę">+</button>
        </div>
      </div>

      <button id="spin" class="spin-button" type="button" aria-label="Zakręć">
        <span>SPIN</span>
      </button>

      <div class="aux-controls">
        <button id="turbo" type="button" aria-pressed="false">TURBO</button>
        <button id="sound" type="button" aria-pressed="true">DŹWIĘK</button>
      </div>
    </footer>
  </main>

  <div class="loading-screen" id="loading-screen">
    <div class="loading-crest">♛</div>
    <strong>ROYAL ARC</strong>
    <div class="loading-track"><i id="loading-progress"></i></div>
    <span id="loading-text">Ładowanie 0%</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" crossorigin="anonymous"></script>
  <script src="./slot.js"></script>
</body>
</html>
