<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#040506">
<meta name="game-build" content="legnica-v4-cabinet">
<title>Brama Piastów — V4 Cabinet</title>
<link rel="stylesheet" href="v4.css">
</head>
<body>
<main class="scene" id="scene">
<canvas class="fx" id="fx"></canvas>
<div class="cabinet" id="cabinet">
  <div class="balanceChip">
    <div class="chip gold"><small>JACKPOT</small><b id="jackpot">1 284 750</b></div>
    <div class="chip"><small>SALDO</small><b id="balance">10 000</b></div>
  </div>
  <div class="free" id="freePill">FREE SPINS × <span id="freeCount">0</span></div>
  <header class="marquee">
    <div class="eyebrow">Piast Legacy · Legnica</div>
    <h1>BRAMA PIASTÓW</h1>
    <div class="sub">5×3 · 20 LINII · GATE BONUS</div>
  </header>
  <section class="body">
    <aside class="pillar left"></aside>
    <div class="core">
      <div class="portal">
        <div class="crownEmblem" aria-hidden="true">
          <svg viewBox="0 0 120 100"><defs><linearGradient id="cg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff1a8"/><stop offset=".4" stop-color="#e4a930"/><stop offset="1" stop-color="#7e4608"/></linearGradient></defs><path d="M18 72 13 30l25 20L60 10l22 40 25-20-5 42z" fill="url(#cg)" stroke="#5f3507" stroke-width="3"/><path d="M17 72h86v15H17z" rx="6" fill="#b87515"/><circle cx="60" cy="12" r="7" fill="#fff2ae"/></svg>
        </div>
        <div class="reelRig" id="rig">
          <div class="reels" id="reels"></div>
          <div class="scan"></div>
          <div class="paylines"><i class="line l1"></i><i class="line l2"></i><i class="line l3"></i><i class="line l4"></i><i class="line l5"></i></div>
        </div>
        <div class="hud">
          <div class="status" id="status">Gotowy do gry</div>
          <div></div>
          <div class="gate"><span>GATE <b id="keys">0/3</b></span><span class="gateBar"><i id="gateFill"></i></span></div>
        </div>
      </div>
    </div>
    <aside class="pillar right"></aside>
  </section>
  <section class="controls">
    <div class="leftCtl">
      <div class="betBox"><button id="betMinus">−</button><div class="metric"><small>STAWKA</small><b id="bet">50</b></div><button id="betPlus">+</button></div>
      <div class="metric"><small>TRYB</small><b>20 LINII</b></div>
    </div>
    <button class="spinBtn" id="spin">SPIN</button>
    <div class="rightCtl">
      <div class="metric"><small>WYGRANA</small><b id="win">0</b></div>
      <button class="small" id="turbo">TURBO</button>
      <button class="small" id="sound">DŹWIĘK</button>
      <button class="small" id="auto">AUTO</button>
    </div>
  </section>
</div>
</main>
<script src="v4.js" defer></script>
</body>
</html>
